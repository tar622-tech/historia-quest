<style>
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }

  main > .row h1 { color: var(--leaf) !important; text-shadow: 0 3px 0 var(--woodD), 3px 0 0 var(--woodD), -3px 0 0 var(--woodD), 0 -3px 0 var(--woodD); }
  .scroll { overflow-x: auto; }
  .heat td.h { text-align: center; font-family: Mitr; border-radius: 4px; }
  .flag { color: #ffb3ad; }
  .settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
